server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /user/api/v1/ { proxy_pass http://api:8080/user/api/v1/; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /admin/api/v1/ { proxy_pass http://api:8080/admin/api/v1/; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /v1/ { proxy_pass http://gateway:8081/v1/; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 600s; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { try_files $uri $uri/ /index.html; }
}
